name: Browser checks

# Real headless Chrome checks (slow, network for map tiles): weekly and on demand.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  browser:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        check: [scale-check, map-check]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Run ${{ matrix.check }}
        env:
          CHROME: /usr/bin/google-chrome
          CHECK: ${{ matrix.check }}
        run: node "tools/$CHECK.mjs"
