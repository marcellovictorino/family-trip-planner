name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Unit tests
        run: node --test test/*.test.mjs
      - name: Data check
        run: node tools/validate-data.mjs
      - name: Offline check
        run: node tools/verify-app.mjs
  changelog:
    name: changelog
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: CHANGELOG.md is touched
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git diff --name-only "origin/$BASE...HEAD" | grep -qx CHANGELOG.md \
            || { echo "::error::Add an entry to CHANGELOG.md and bump src/version.js"; exit 1; }
  # Deploys only after the test job passes on a push to main. Inert until the
  # repository variable PAGES_FROM_ACTIONS is "true", set when Pages source is
  # switched to GitHub Actions.
  deploy:
    name: deploy
    needs: test
    if: github.event_name == 'push' && vars.PAGES_FROM_ACTIONS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
